trigger:
- azure-pipeline-test

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build job
        pool: br-agent

        steps:

        - task: DockerInstaller@0
          displayName: Install docker CLI on agent machine
          inputs:
            dockerVersion: '28.5.2'

        - script: |
            mkdir -p ~/.docker/cli-plugins/
            curl -SL https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
            docker compose

        - task: DockerCompose@1
          displayName: Build Services
          inputs:
            containerregistrytype: 'Container Registry'
            dockerRegistryEndpoint: 'docker-service-connection'
            dockerComposeFile: 'docker-compose.yml'
            requireAdditionalDockerComposeFiles: true
            additionalDockerComposeFiles: |
              docker-compose.override.yml
              docker-compose.traefik.yml
            dockerComposePath: ~/.docker/cli-plugins/docker-compose
            action: 'Build services'
            


trigger:
- none

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build job
        pool: br-agent

        steps:

        - task: DockerInstaller@0
          inputs:
            dockerVersion: '28.5.2'

        - script: |
            systemctl status docker
            docker build -f backend/Dockerfile -t backend:latest .
          displayName: Build backend image


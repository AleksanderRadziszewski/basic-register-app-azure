trigger:
- none

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build job
        pool: br-agent

        steps:

        - task: DockerInstaller@0
          displayName: Install docker CLI on agent machine
          inputs:
            dockerVersion: '28.5.2'

        - task: Docker@2
          inputs:
            containerRegistry: 'docker-service-connection'
            repository: 'basic_register_app'
            command: 'buildAndPush'
            Dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: '$(Build.SourceVersion)'

        

        
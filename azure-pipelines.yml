trigger:
- none

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build job
        pool: br-agent

        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-service-connection'
            repository: 'basic_register_app'
            command: 'build'
            Dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: '$(Build.SourceVersion)'
